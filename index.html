<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>デジタル名刺</title><style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600&display=swap');
:root{
  /* 既定値（ゴールド）。実際の色はJSがconfig.themeから計算して上書きします */
  --accent:#e6c877; --brand-dark:#b8891f; --c-bright:#f3d98a; --champ:#f0dda8;
  --grad:linear-gradient(135deg,#f3d98a,#e6c877 45%,#a8832a);
  --glow-strong:rgba(212,175,55,.40); --glow-mid:rgba(212,175,55,.28); --glow-soft:rgba(212,175,55,.16);
  --bg-base:#0a0805; --bg-glow1:rgba(212,175,55,.26); --bg-glow2:rgba(184,137,31,.20);
  --cover-a:#231b0e; --cover-b:#100b06; --ava-a:#2a2214; --ava-b:#161009;
  --name-light:#f6e6bd; --save-txt:#ecd28c; --line-acc:rgba(230,200,120,.18);
  --text:#f8f2e6; --muted:#b3a689; --card:rgba(255,255,255,.045); --line:var(--line-acc); --radius:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"Zen Kaku Gothic New",sans-serif;color:var(--text);min-height:100dvh;
  padding:28px 18px calc(38px + env(safe-area-inset-bottom));display:flex;justify-content:center;
  background:
    radial-gradient(90% 55% at 50% -8%, var(--bg-glow1), transparent 60%),
    radial-gradient(70% 40% at 85% 108%, var(--bg-glow2), transparent 60%),
    var(--bg-base) fixed;
}
.wrap{width:100%;max-width:432px}

/* ===== ヘッダーカード（グラデ細枠＋グラス） ===== */
.hero{position:relative;border-radius:var(--radius);overflow:hidden;
  background:
    radial-gradient(88% 52% at 78% 0%, var(--glow-strong), transparent 55%),
    linear-gradient(180deg, var(--cover-a) 0%, var(--cover-b) 40%, var(--bg-base) 100%);
  box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 60px var(--glow-soft);}
.hero::before{content:"";position:absolute;inset:0;border-radius:var(--radius);padding:1.6px;
  background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:1;z-index:3}
.cover{height:128px;position:relative;background:transparent;pointer-events:none;z-index:0}
.cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,.06) 50%, transparent 58%);}
.hero-body{padding:0 26px 28px;text-align:center;position:relative;z-index:1}

/* アバター：グラデリング＋グロー */
.avatar{width:114px;height:114px;border-radius:50%;margin:-60px auto 0;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(160deg,var(--ava-a),var(--ava-b));
  color:var(--champ);font-family:"Cormorant Garamond",serif;font-size:44px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.55), 0 0 26px var(--glow-mid);}
.avatar::before{content:"";position:absolute;inset:-3px;border-radius:50%;z-index:-1;
  background:conic-gradient(from 210deg,var(--c-bright),var(--accent),var(--brand-dark),var(--c-bright));}
.avatar::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(160deg,var(--ava-a),var(--ava-b));z-index:-1}
.avatar img{width:100%;height:100%;object-fit:contain;border-radius:50%}
/* 写真そのまま（四角・トリミングなし）モード */
.avatar.ava-photo{display:inline-block;width:auto;max-width:200px;height:auto;margin:-26px 0 0;padding:3px;border-radius:20px;background:var(--grad);overflow:visible;box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 30px var(--glow-mid)}
.avatar.ava-photo::before,.avatar.ava-photo::after{content:none;display:none}
.avatar.ava-photo img{display:block;width:100%;height:auto;max-height:240px;object-fit:contain;border-radius:17px;transform:none!important;background:#0d0a06}

.name{font-size:27px;font-weight:900;margin:18px 0 3px;letter-spacing:.05em;
  background:linear-gradient(180deg,#ffffff 25%,var(--name-light) 100%);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.kana{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:16px;letter-spacing:.24em;
  margin:0 0 4px;color:var(--accent);text-transform:uppercase}
.rule{width:44px;height:1px;margin:12px auto 12px;position:relative;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.rule::after{content:"";position:absolute;top:-2.5px;left:50%;width:5px;height:5px;transform:translateX(-50%) rotate(45deg);background:var(--c-bright);box-shadow:0 0 8px var(--glow-strong)}
.title{font-size:13.5px;color:var(--muted);margin:2px 0;letter-spacing:.05em}
.org{font-size:15px;font-weight:700;margin:6px 0 0;letter-spacing:.05em;color:var(--name-light)}
.tagline{font-size:12.5px;color:var(--muted);margin:16px 8px 0;line-height:1.95}

/* ===== クイック連絡 ===== */
.quick{display:flex;gap:11px;margin:22px 0 0}
.quick a{flex:1;position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:15px 6px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:11px;letter-spacing:.04em;backdrop-filter:blur(8px);transition:.15s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.quick a:active{transform:scale(.95);border-color:var(--accent)}
.quick .ico{width:24px;height:24px;color:var(--accent)}

/* ===== vCard 保存：縁取りだけ（塗りつぶしなし） ===== */
.save-btn{position:relative;display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
  margin:20px 0 0;padding:18px;cursor:pointer;background:transparent;border:none;border-radius:15px;
  color:var(--save-txt);font-family:"Zen Kaku Gothic New",sans-serif;font-size:15.5px;font-weight:800;letter-spacing:.08em;
  box-shadow:0 8px 30px var(--glow-soft);transition:.15s;overflow:hidden}
.save-btn::before{content:"";position:absolute;inset:0;border-radius:15px;padding:1.6px;
  background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.save-btn::after{content:"";position:absolute;inset:0;border-radius:15px;opacity:0;transition:.2s;
  background:radial-gradient(120% 100% at 50% 120%, var(--glow-soft), transparent 70%)}
.save-btn:active{transform:scale(.98)}
.save-btn:active::after{opacity:1}
.save-btn .ico{width:21px;height:21px;position:relative}

/* ===== リンク集 ===== */
.section-label{font-family:"Poppins",sans-serif;font-size:12px;color:var(--accent);font-weight:600;
  letter-spacing:.3em;margin:32px 8px 14px;text-transform:uppercase}
.links{display:flex;flex-direction:column;gap:11px}
.link{position:relative;display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--card);
  border:1px solid var(--line);border-radius:15px;padding:15px 16px;color:var(--text);backdrop-filter:blur(8px);
  transition:.15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.link:active{transform:scale(.985);border-color:var(--accent)}
.link .badge{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06) inset}
.link .badge svg{width:21px;height:21px}
.link .l-main{flex:1;min-width:0}
.link .l-title{font-size:14.5px;font-weight:700;letter-spacing:.02em}
.link .l-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.link .chev{width:17px;height:17px;color:var(--accent);flex:none}

/* プロフィール欄 */
.profile-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 18px;backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.profile-card p{margin:0;font-size:13px;line-height:2;color:var(--text);white-space:pre-wrap;opacity:.92}

/* QRコード */
.qr-card{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.qr-box{width:188px;height:188px;background:#fff;border-radius:12px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.qr-box svg{width:100%;height:100%;display:block}
.qr-cap{margin:0;font-size:11.5px;color:var(--muted);letter-spacing:.18em}

/* 写真枠を非表示にした時のレイアウト調整 */
body.no-avatar .cover{height:74px}
body.no-avatar .hero-body{padding-top:34px}
.foot{text-align:center;color:var(--muted);font-family:"Poppins",sans-serif;font-size:10.5px;margin:32px 0 0;letter-spacing:.16em}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
  background:var(--grad);color:#1a1408;padding:12px 24px;border-radius:999px;
  font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50;
  box-shadow:0 10px 30px var(--glow-strong)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;

(function(){var S=document.documentElement.style;var th=CONFIG.theme||{};var acc=th.accent||th.brand||'#e6c877',deep=th.brandDark||'#b8891f';

function buildVCard(){const c=CONFIG.contact,p=(CONFIG.name||"").trim().split(/\s+/);const last=p[0]||"",first=p.slice(1).join(" ")||"";let v="BEGIN:VCARD\nVERSION:3.0\nN:"+last+";"+first+";;;\nFN:"+(CONFIG.name||"")+"\n";if(CONFIG.org)v+="ORG:"+CONFIG.org+"\n";if(CONFIG.title)v+="TITLE:"+CONFIG.title+"\n";if(c.phone)v+="TEL;TYPE=CELL:"+c.phone+"\n";if(c.email)v+="EMAIL:"+c.email+"\n";if(c.website)v+="URL:"+c.website+"\n";if(c.address)v+="ADR;TYPE=WORK:;;"+c.address+";;;;\n";if(CONFIG.avatar&&CONFIG.avatar.indexOf('data:image')===0){var mt=/data:image\/([a-zA-Z]+)/.exec(CONFIG.avatar);var typ=mt?mt[1].toUpperCase():'JPEG';if(typ==='JPG')typ='JPEG';var b64=CONFIG.avatar.split(',')[1];if(b64)v+="PHOTO;ENCODING=b;TYPE="+typ+":"+b64+"\n";}return v+"END:VCARD";}
